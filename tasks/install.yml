---

- import_tasks: user.yml
  when: 
    - patroni_install_from_pip
    - not (ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('24.04', '>='))

- import_tasks: postgresql.yml
  when: not patroni_postgresql_exists

- import_tasks: watchdog.yml
  when: patroni_watchdog_mode in ('automatic', 'required')

- name: Install system packages for patroni
  package:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
    update_cache: yes
  with_items:
    - "{{ patroni_system_packages }}"
  when: 
    - patroni_install_from_pip
    - not (ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('24.04', '>='))

- name: Install pip packages for patroni
  pip:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
    umask: "{{ item.umask }}"
    executable: "{{ item.executable }}"
  with_items:
    - "{{ patroni_pip_packages }}"
  when: 
    - patroni_install_from_pip
    - not (ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('24.04', '>='))

# For Ubuntu 24.04+, install Patroni and dependencies via APT (after other setup)
- name: Install Patroni and dependencies via APT (Ubuntu 24.04+)
  package:
    name: "{{ item }}"
    state: present
    update_cache: yes
  with_items: "{{ (__patroni_apt_packages | map(attribute='name') | list) + ([patroni_dcs_packages[patroni_dcs]] if patroni_dcs_packages[patroni_dcs] else []) }}"
  when:
    - ansible_distribution == 'Ubuntu'
    - ansible_distribution_version is version('24.04', '>=')