---

- import_tasks: user.yml
  when: patroni_install_from_pip

- import_tasks: postgresql.yml
  when: not patroni_postgresql_exists

- import_tasks: watchdog.yml
  when: patroni_watchdog_mode in ('automatic', 'required')

- name: Install system packages for patroni
  package:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
    update_cache: yes
  with_items:
    - "{{ patroni_system_packages }}"
  when: patroni_install_from_pip

# Use system packages for Ubuntu 24.04+ (PEP 668 compliance)
- name: Install patroni via apt packages (Ubuntu 24+)
  package:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
    update_cache: yes
  with_items:
    - "{{ patroni_apt_packages }}"
  when: 
    - patroni_install_from_pip
    - ansible_distribution == 'Ubuntu'
    - ansible_distribution_version is version('24.04', '>=')

# Use pip for older systems or when system packages aren't available
- name: Install pip packages for patroni (pre-Ubuntu 24)
  pip:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
    umask: "{{ item.umask }}"
    executable: "{{ item.executable }}"
  with_items:
    - "{{ patroni_pip_packages }}"
  when: 
    - patroni_install_from_pip
    - not (ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('24.04', '>='))
