---

- import_tasks: user.yml
  when: patroni_install_from_pip

- import_tasks: postgresql.yml
  when: not patroni_postgresql_exists

- import_tasks: watchdog.yml
  when: patroni_watchdog_mode in ('automatic', 'required')

# ===== UBUNTU 24.04+ APT INSTALLATION (PEP 668 Compliant) =====
- name: Install system packages for patroni (Ubuntu 24+ apt method)
  package:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
    update_cache: yes
  with_items: "{{ patroni_system_apt_packages }}"
  when: 
    - patroni_install_from_pip
    - ansible_distribution == 'Ubuntu'
    - ansible_distribution_version is version('24.04', '>=')

- name: Install PostgreSQL packages (Ubuntu 24+ apt method)
  package:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
    update_cache: yes
  with_items: "{{ patroni_postgresql_packages }}"
  when: 
    - patroni_install_from_pip
    - ansible_distribution == 'Ubuntu'
    - ansible_distribution_version is version('24.04', '>=')
    - not patroni_postgresql_exists

- name: Install core patroni packages via apt (Ubuntu 24+)
  package:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
    update_cache: yes
  with_items: "{{ patroni_apt_packages }}"
  when: 
    - patroni_install_from_pip
    - ansible_distribution == 'Ubuntu'
    - ansible_distribution_version is version('24.04', '>=')

- name: Install DCS-specific package via apt (Ubuntu 24+)
  package:
    name: "{{ patroni_dcs_packages[patroni_dcs] }}"
    state: present
    update_cache: yes
  when: 
    - patroni_install_from_pip
    - ansible_distribution == 'Ubuntu'
    - ansible_distribution_version is version('24.04', '>=')
    - patroni_dcs in patroni_dcs_packages.keys()

# ===== PRE-UBUNTU 24 PIP INSTALLATION =====
- name: Install system packages for patroni (pip method)
  package:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
    update_cache: yes
  with_items: "{{ patroni_system_packages }}"
  when: 
    - patroni_install_from_pip
    - not (ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('24.04', '>='))

# Use pip for older systems or when system packages aren't available
- name: Install pip packages for patroni (pre-Ubuntu 24)
  pip:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
    umask: "{{ item.umask }}"
    executable: "{{ item.executable }}"
  with_items:
    - "{{ patroni_pip_packages }}"
  when: 
    - patroni_install_from_pip
    - not (ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('24.04', '>='))
